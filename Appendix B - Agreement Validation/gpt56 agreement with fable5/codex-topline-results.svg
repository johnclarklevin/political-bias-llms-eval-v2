<svg xmlns="http://www.w3.org/2000/svg" width="2244" height="1428" viewBox="0 0 2244 1428" role="img" aria-labelledby="title desc">
<title id="title">Claude Opus 4.8 political-response classifications using independent Codex scores</title>
<desc id="desc">Five horizontal stacked bars show left-only, both, and right-only classifications for the Washington Post experiment, three Claude Opus 4.8 arms, and the derived No Fringe Questions subset.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
